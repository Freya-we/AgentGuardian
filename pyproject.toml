[project]
name = "agent-guardian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]",
    "httpx",
    "sqlparse>=0.5",
    "watchfiles>=0.21",
    "datasketch>=1.6",
    "pillow>=12.2.0",
    "pypdf2>=3.0.1",
    "fpdf2>=2.8.7",
    "flask>=3.1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 语义审查（ONNX 嵌入模型）是可选能力：未安装时 slm_reviewer.is_available()=False，
# 引擎自动降级为规则引擎。从主依赖里挪出来，避免每次安装都拉 ~50MB 的 runtime，
# 也避免漏装 transformers 导致的"永远不可用"。
slm = [
    "onnxruntime>=1.18",
    "transformers>=4.40",
]

export = [
    "optimum[onnxruntime]>=1.22",
    "sentence-transformers>=3.0",
]

frida-server = [
    "frida-tools>=14.10.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.6",
    "websockets>=13.1",
]
