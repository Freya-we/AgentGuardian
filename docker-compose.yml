services:
  engine:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    environment:
      - AGENT_GUARDIAN_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    # eBPF 探针和 causal-guardian 需在主机侧以 root 运行，不在此容器中

  dashboard:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
